name: Build Windows Tauri

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/openhub-tauri/**"
      - ".github/workflows/windows-tauri.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/openhub-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: windows/openhub-tauri
        run: npm install

      - name: Build Windows installer
        working-directory: windows/openhub-tauri
        run: npm run build:windows

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: OpenHub-Windows
          path: |
            windows/openhub-tauri/src-tauri/target/release/bundle/nsis/*.exe
            windows/openhub-tauri/src-tauri/target/release/bundle/msi/*.msi
